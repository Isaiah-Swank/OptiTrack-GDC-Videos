<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OptiTrack Video Showcase</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>GDC 2025 OptiTrack Videos</h1>
      <p>View and download the OptiTrack Videos from GDC 2025.</p>
    </header>
    
    <div class="video-wrapper">
      <h2> TrackIR Video </h2>
      <video controls>
        <!-- Convert your TrackIR.MOV to TrackIR.mp4 -->
        <source src="TrackIR.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <br>
      <a class="download-button" href="TrackIR.mp4" download>Download Video</a>
    </div>

    <div class="video-wrapper">
      <h2> OptiTrack Pickleball Part 1 Video </h2>
      <video controls>
        <!-- Convert your OptiTrack-Pickleball-Part-1.MOV to OptiTrack-Pickleball-Part-1.mp4 -->
        <source src="OptiTrack-Pickleball-Part-1.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <br>
      <a class="download-button" href="OptiTrack-Pickleball-Part-1.mp4" download>Download Video</a>
    </div>

    <div class="video-wrapper">
      <h2> OptiTrack Pickleball Part 2 Video </h2>
      <video controls>
        <!-- Convert your OptiTrack-Pickleball-Part-2.MOV to OptiTrack-Pickleball-Part-2.mp4 -->
        <source src="OptiTrack-Pickleball-Part-2.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <br>
      <a class="download-button" href="OptiTrack-Pickleball-Part-2.mp4" download>Download Video</a>
    </div>
    
    <footer>
      <p> All Footage Above is From GDC 2025 and Informa is the Owner of the Footage</p>
    </footer>
  </div>
</body>
</html>
